[project]
name = "hedgelab"
version = "0.1.0"
description = "Calibration and hedging of a zero-cost Asian/basket collar on ICE Brent futures (Computational Finance 2025/26)."
authors = [
    { name = "Giulia Talà", email = "giuliatala32@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.12",
    "plotly>=5.24",
]

[project.optional-dependencies]
# Native Qt table browser for raw data (heavy wheel, so opt-in: `uv sync --extra gui`).
gui = ["pyside6>=6.8"]

[project.scripts]
hedgelab = "hedgelab.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "commitizen>=3.30",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "D",        # pydocstyle (NumPy convention below)
    "ANN",      # type annotations
    "T20",      # no print() outside CLI
    "FA",       # from __future__ import annotations
    "PTH",      # pathlib over os.path
    "RUF",
]
ignore = [
    "D105",     # magic-method docstrings
    "D107",     # __init__ docstrings (documented on the class)
    "N803", "N806",  # allow math-style names like K, T, F in quant code
    "RUF001", "RUF002", "RUF003",  # allow greek letters in docstrings/comments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"notebooks/**" = ["D", "ANN", "T20", "E402"]
"src/hedgelab/cli.py" = ["T20"]
"scripts/build_*_notebook.py" = ["E501"]  # markdown table rows cannot be wrapped

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hedgelab"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly.*", "pyarrow.*", "openpyxl.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: tests that need the course dataset in DATA_DIR (skipped if absent)",
    "slow: Monte Carlo / backtest tests",
]

# --------------------------------------------------------------------------- commitizen
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
