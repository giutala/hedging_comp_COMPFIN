<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --good: #006300; --critical: #d03b3b;
}
body { background: var(--page); color: var(--ink); margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 8px 0 4px; }
h2 { font-size: 17px; margin: 0 0 4px; }
p { color: var(--ink-2); line-height: 1.5; }
.cap { margin: 0 0 8px; font-size: 14px; }
section, .card { background: var(--surface); border: 1px solid rgba(11, 11, 11, .10);
  border-radius: 8px; padding: 16px; margin: 16px 0; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { border-bottom: 1px solid var(--grid); padding: 6px 8px; text-align: left;
  vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.mark { font-weight: 700; }
tr.pass td.mark { color: var(--good); }
tr.fail td.mark { color: var(--critical); }
tr.note td.mark { color: var(--muted); }
code { font-size: 12px; }
</style>
</head>
<body>
<main>
<h1>$title</h1>
<p>$intro</p>
<div class="card">
<h2>Data-quality checks</h2>
<p class="cap">&#10003; passed &middot; &#10007; blocking failure &middot;
i informational (known imperfection, handled downstream)</p>
<table>
<thead><tr><th></th><th>check</th><th>condition</th><th>failed / tested</th><th>note</th></tr></thead>
<tbody>
$rows
</tbody>
</table>
</div>
$body
</main>
</body>
</html>
